<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindcraft AI Kontrol Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Mindcraft AI Merkezi</h1>
            <p class="text-slate-400 mt-2">Otonom Ajan Kontrol Paneli</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-2xl shadow-xl">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="text-emerald-400">⚡</span> Sunucu Bağlantısı</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Sunucu IP</label>
                        <input type="text" id="ip" value="localhost" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500 transition-all">
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-sm text-slate-400 mb-1">Port</label>
                            <input type="text" id="port" value="25565" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500 transition-all">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm text-slate-400 mb-1">Bot Adı</label>
                            <input type="text" id="botName" value="Yapayzeka" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-emerald-500 transition-all">
                        </div>
                    </div>
                    <button onclick="connectBot()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform active:scale-95 transition-all">
                        Oyuna Bağlan
                    </button>
                    <p id="statusMsg" class="text-sm text-center mt-2 text-slate-400"></p>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl shadow-xl">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><span class="text-cyan-400">📊</span> Canlı Durum</h2>
                <div id="offlineState" class="h-full flex items-center justify-center text-slate-500">Bot şu an çevrimdışı.</div>
                
                <div id="onlineState" class="hidden space-y-4">
                    <div class="flex justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <span class="text-slate-400">Bağlı Sunucu:</span>
                        <span id="statIp" class="font-mono text-emerald-400">...</span>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1 bg-slate-800 p-3 rounded-lg border border-slate-700 text-center">
                            <div class="text-sm text-slate-400">Can ❤️</div>
                            <div class="text-xl font-bold text-red-400" id="statHealth">-</div>
                        </div>
                        <div class="flex-1 bg-slate-800 p-3 rounded-lg border border-slate-700 text-center">
                            <div class="text-sm text-slate-400">Açlık 🍖</div>
                            <div class="text-xl font-bold text-orange-400" id="statFood">-</div>
                        </div>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <div class="text-sm text-slate-400 text-center mb-1">Koordinatlar 📍</div>
                        <div class="text-center font-mono text-cyan-400" id="statPos">X: - | Y: - | Z: -</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function connectBot() {
            const btn = document.querySelector('button');
            const msg = document.getElementById('statusMsg');
            btn.innerHTML = 'Bağlanıyor...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            const payload = {
                ip: document.getElementById('ip').value,
                port: parseInt(document.getElementById('port').value),
                username: document.getElementById('botName').value
            };

            try {
                const res = await fetch('/api/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msg.innerHTML = `<span class="text-emerald-400">${data.message}</span>`;
            } catch (err) {
                msg.innerHTML = `<span class="text-red-400">Bağlantı hatası!</span>`;
            }
            
            btn.innerHTML = 'Oyuna Bağlan';
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
        }

        setInterval(async () => {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.online) {
                    document.getElementById('offlineState').classList.add('hidden');
                    document.getElementById('onlineState').classList.remove('hidden');
                    
                    document.getElementById('statIp').innerText = data.server;
                    document.getElementById('statHealth').innerText = data.health;
                    document.getElementById('statFood').innerText = data.food;
                    document.getElementById('statPos').innerText = `X: ${data.position.x} | Y: ${data.position.y} | Z: ${data.position.z}`;
                } else {
                    document.getElementById('onlineState').classList.add('hidden');
                    document.getElementById('offlineState').classList.remove('hidden');
                }
            } catch (e) {}
        }, 2000);
    </script>
</body>
                            </html>
